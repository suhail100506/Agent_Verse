[project]
name = "fake_certificate_verification_agent"
version = "0.1.0"
description = "fake_certificate_verification_agent using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[file-processing,google-genai,litellm,tools]>=1.15.5,<2.0.0",
    "exa-py",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
    "pymongo>=4.6.0",
    "pillow>=10.0.0",
    "pypdf>=4.0.0",
    "cryptography>=42.0.0",
    "apscheduler>=3.10.0",
    "imap-tools>=1.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/fake_certificate_verification_agent",
    "src/identity_verification_agent",
    "src/cyberverse_orchestrator",
    "src/malware_analyzer_agent",
    "src/threat_detection_agent",
    "src/phishing_detection_agent",
    "src/privacy_compliance_agent",
    "src/password_advisor_agent",
    "src/fraud_detection_agent",
    "src/incident_response_agent",
    "src/social_engineering_agent"
]

[tool.crewai]
type = "flow"
definition = "src/fake_certificate_verification_agent/flow.json"

[tool.uv]
override-dependencies = ["litellm<=1.82.6"]
